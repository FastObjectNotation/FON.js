name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-native:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: fon_native.dll
            artifact_name: fon_native-windows-x64.dll
          - os: ubuntu-latest
            artifact: libfon_native.so
            artifact_name: libfon_native-linux-x64.so
          - os: macos-latest
            artifact: libfon_native.dylib
            artifact_name: libfon_native-macos-arm64.dylib

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check that the tag matches the package and the native library
        shell: bash
        run: |
          PACKAGE=$(grep -m1 -oE '"version": "[^"]+"' package.json | cut -d'"' -f4)
          NATIVE=$(grep -m1 -oE '^version = "[^"]+"' native/Cargo.toml | cut -d'"' -f2)
          if [ "v$PACKAGE" != "$GITHUB_REF_NAME" ] || [ "$PACKAGE" != "$NATIVE" ]; then
            echo "::error::tag $GITHUB_REF_NAME, package.json $PACKAGE and native/Cargo.toml $NATIVE do not agree"
            exit 1
          fi

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target

      - name: Build cdylib
        run: cargo build --release --manifest-path native/Cargo.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp native/target/release/${{ matrix.artifact }} dist/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  # Installs the tarball exactly as a user would and loads the shipped library from it.
  verify-package:
    name: Install and load the packed tarball
    runs-on: ubuntu-latest
    needs: build-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Stage native libraries for the package
        shell: bash
        run: |
          mkdir -p prebuilds
          find dist -type f -exec cp {} prebuilds/ \;

      - name: Pack, install and load
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/fastobjectnotation-*.tgz
          node --input-type=module -e "import { FonCollection, nativeVersion } from 'fastobjectnotation'; const c = new FonCollection().addInt('id', 42); if (c.getInt('id') !== 42) { process.exit(1); } console.log('loaded native', nativeVersion());"

  publish:
    name: Publish to npm & create Release
    runs-on: ubuntu-latest
    needs: [build-native, verify-package]
    # npm trusted publishing: the job's OIDC token authenticates `npm publish`, no npm token.
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js (npm registry)
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1 or later, which ships with Node 24.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Stage native libraries for the package
        shell: bash
        run: |
          mkdir -p prebuilds
          find dist -type f -exec cp {} prebuilds/ \;
          ls -l prebuilds

      - name: Publish to npm
        run: |
          npm --version
          npm publish

      # gh instead of a third-party action: this job holds the npm publishing identity.
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $(find dist -type f)
